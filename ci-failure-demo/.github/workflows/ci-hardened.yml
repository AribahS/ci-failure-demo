# Same demo, with the defenses CI/CD Guardian looks for.
name: CI Hardened

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      scenario:
        description: Which failure to simulate
        type: choice
        default: pass
        options: [pass, test-fail, build-error, dependency, flaky, missing-secret]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-demo
      - name: Check network
        run: curl --retry 3 -fsS https://api.github.com/zen
      - name: Run scenario
        shell: bash
        env:
          SCENARIO: ${{ github.event.inputs.scenario || 'pass' }}
        run: bash scripts/run-scenario.sh "$SCENARIO" 2>&1 | tee run.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ matrix.os }}
          path: run.log
          if-no-files-found: ignore

  deploy:
    needs: build-and-test
    if: github.event.inputs.scenario == 'missing-secret'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: test -n "$DEPLOY_TOKEN" || { echo "DEPLOY_TOKEN is not set"; exit 1; }
