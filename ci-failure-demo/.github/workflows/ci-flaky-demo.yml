# DELIBERATELY WEAK workflow: built to trigger every CI/CD Guardian rule
# and to let you simulate real failures on demand (Actions tab > Run workflow).
name: CI Flaky Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: Which failure to simulate
        type: choice
        default: pass
        options: [pass, test-fail, build-error, dependency, flaky, missing-secret]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v2
      - name: Run scenario
        env:
          SCENARIO: ${{ github.event.inputs.scenario || 'pass' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/demo && cd /tmp/demo
          npm init -y > /dev/null
          echo "Scenario: $SCENARIO"
          case "$SCENARIO" in
            pass)
              node -e "console.log('3 tests passed')" ;;
            test-fail)
              node -e "require('assert').strictEqual(1 + 1, 3, 'expected 1+1 to equal 3')" ;;
            build-error)
              echo "const x = ;" > broken.js
              node --check broken.js ;;
            dependency)
              npm install this-package-does-not-exist-zzz-404 ;;
            flaky)
              if [ $((RANDOM % 2)) -eq 0 ]; then echo "passed"; else echo "Timing-dependent test failed"; exit 1; fi ;;
            missing-secret)
              echo "build ok - failure happens at deploy" ;;
            *)
              echo "Unknown scenario"; exit 2 ;;
          esac

  deploy:
    needs: build-and-test
    if: github.event.inputs.scenario == 'missing-secret'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: test -n "$DEPLOY_TOKEN" || { echo "DEPLOY_TOKEN is not set"; exit 1; }
